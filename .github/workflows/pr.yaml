---
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - "v*"

name: Pull Request

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Protoc
        uses: cerbos/actions/install-tools@2982bc2c3b7a118fb59778962ef3de549f9aca30 # main
        with:
          tools: protoc

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          override: true
          components: rustfmt, clippy

      - name: Run cargo check
        run: cargo check

      - name: Run cargo clippy
        run: cargo clippy --all-features -- -D warnings

      - name: Install Cerbos
        uses: cerbos/cerbos-setup-action@272365d3ee2373a3e4a2aecb8cdf3852b452b4c1 # v1.9.14
        with:
          version: latest

      - name: Run tests
        run: |
          cerbos run --set=storage.disk.directory=tests/testdata/policies --set=auxData.jwt.disableVerification=true -- cargo test --test sdk_test
        env:
          CERBOS_NO_TELEMETRY: "1"

      - name: Run tests in testcontainers
        run: |
          cargo test --features testcontainers --test sdk_test
        env:
          CERBOS_NO_TELEMETRY: "1"

      - name: Run admin tests in testcontainers
        run: |
          cargo test --features admin,serde,testcontainers --test sdk_admin_test
        env:
          CERBOS_NO_TELEMETRY: "1"

      - name: Run Hub Store tests
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CERBOS_HUB_API_ENDPOINT: "${{ secrets.CERBOS_HUB_API_ENDPOINT }}"
          CERBOS_HUB_CLIENT_ID: "${{ secrets.CERBOS_HUB_CLIENT_ID }}"
          CERBOS_HUB_CLIENT_SECRET: "${{ secrets.CERBOS_HUB_CLIENT_SECRET }}"
          CERBOS_HUB_STORE_ID: "${{ secrets.CERBOS_HUB_STORE_ID }}"
        run: |
          cargo test --features hub --test store_integration_test -- --test-threads=1
