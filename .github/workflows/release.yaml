---
on:
  workflow_dispatch:
  push:
    tags:
      - if-struct-macro-v*
      - v*

name: Release

defaults:
  run:
    shell: bash

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Protoc
        uses: cerbos/actions/install-tools@7df6503218a73e5022cc801e99574380474c97dd # main
        with:
          tools: protoc

      - name: Install stable toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
          override: true
          components: rustfmt, clippy

      - name: Run cargo check
        run: cargo check

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish
        run: |
          case "${GITHUB_REF_NAME}" in
            if-struct-macro-v*)
              package="if-struct-macro"
              ;;

            v*)
              package="cerbos"
              ;;

            *)
              printf "::error::Tag %s does not correspond to a known package\n" "${GITHUB_REF_NAME}"
              ;;
          esac

          cargo publish --package "${package}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
